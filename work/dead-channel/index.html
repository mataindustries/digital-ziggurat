      <h1>Dead Channel</h1>
      <p>A 22-second horror-comedy about a spirit detector that cannot see anything and can be heard by everything. The original Convergence soundtrack was synthesized separately in Python/NumPy DSP using 240 coordinated virtual sound sources.</p>
      <p>In V4.2 the detector glitches during the approach, then its entity count returns to zero at frame 1192.</p>
      <p>Horror-comedy · sudden loud sounds near the end · best with headphones. English SDH captions and a descriptive transcript are available. The final sound is the intentionally right-weighted spirit convergence effect.</p>
      <p><a href="/media/dead-channel/film-22s-1280x720p60.mp4">Open the film (22 seconds)</a> · <a href="/#shoot-the-moon">Back to work</a> · <a href="mailto:matasergio741@gmail.com?subject=Project%20enquiry%20from%20Dead%20Channel">Start a project with Sergio (opens an email draft)</a></p>

      <h2>Descriptive transcript</h2>
      <p>The final sound is the intentionally right-weighted spirit convergence effect, as identified by Sergio Mata. The fictional tutorial is the visual punchline, not the source of this audio.</p>
      <ol><li><strong>0.000–4.000 s.</strong> A figure holds the field-scanner device in a dark corridor. Device screen: ENTITIES DETECTED; --; SCAN RANGE: 40m; Listening…; TX ACTIVE. (Verified at frame 239, 3.983 s.) Rising electronic tones begin at 0.740 s and 2.850 s.</li><li><strong>4.000–6.800 s.</strong> A close view of the device shows its build log. Device screen: FIELD SCANNER / 001; BUILD LOG; SOURCE: AI WEB GUIDE; SETUP COMPLETE; DISCOVERY ENABLED; READING --; TX ACTIVE. (Verified at frame 240, 4.000 s.) Another rising electronic tone begins at 5.780 s.</li><li><strong>6.800–9.800 s.</strong> The corridor view returns. The detector readout glitches during the approach. Device screen: ENTITIES --; DISCOVERY ON at frame 408, 6.800 s. Device screen: ENTITIES ERR; DISCOVERY ON at frame 480, 8.000 s. These are sampled states, not a claim about the first glitch frame. Layered electronic sound builds from approximately 7.250–8.500 s.</li><li><strong>9.800–15.000 s.</strong> Haze fills the corridor as the approach continues. Device screen: ERR persists in verified sampled frames including 588 (9.800 s) and 700 (11.667 s). An electronic surge begins at approximately 9.790 s. Later passages are right-weighted around 13.250–13.500 s and left-weighted around 14.250–14.500 s.</li><li><strong>15.000–17.000 s.</strong> A close view shows a shutdown request while the detector continues transmitting. Device screen at frame 900 (15.000 s): ENTITIES DETECTED; ERR; SHUTDOWN REQUESTED; Awaiting response…; TX ACTIVE. Device screen at frame 960 (16.000 s): ENTITIES DETECTED --; SHUTDOWN REQUESTED. The electronic sound continues.</li><li><strong>17.000–20.017 s.</strong> The corridor view shows the detector still broadcasting. Its count remains unstable before returning to zero. Device screen at frame 1020 (17.000 s): ENTITIES DETECTED; ERR; NO RESPONSE; Broadcast persists; TX ACTIVE. RANGE: 0.00m first appears at frame 1143 (19.050 s), while the count remains ERR. The entity count returns from ERR to 0 at frame 1192 (19.866667 s), zero-based. This differs from the earlier range reading. At that frame the screen also shows RANGE: 0.00m; NO RESPONSE; TX ACTIVE. Six electronic hits begin at 16.990, 17.620, 18.200, 18.730, 19.480 and 19.910 s.</li><li><strong>20.017–20.750 s.</strong> An extreme close-up shows the zero count and the device discoverability setting. Device screen at frame 1201 (20.016667 s): FIELD SCANNER / 001; ENTITIES DETECTED; 0; DISCOVERABLE: EVERYONE; TX ACTIVE. The electronic sound stops. A brief silence lasts approximately 20.150–20.400 s. The designed spirit convergence effect begins at approximately 20.450 s, swarming on the right before the picture cuts.</li><li><strong>20.750–22.000 s.</strong> The picture hard-cuts to a fictional tutorial video page, showing the creator holding a detector. Tutorial page text (visual punchline): AI TUTORIAL; ONE PROMPT!; I made a spirit detector with AI in one prompt!; ELLIS BUILDS. Spirits swarm on the right in the intentionally right-weighted convergence effect. This designed spatial sound is not tutorial dialogue; the fictional tutorial is the visual punchline. The ending picture and soundtrack are preserved.</li></ol>
